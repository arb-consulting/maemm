# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reads this file from the PR's BASE branch, so it only takes effect for pull
# requests targeting main. After changing it, re-trigger an open PR with `@coderabbitai
# full review` -- an incremental `review` will not re-read the config for work it has
# already walked.

language: en-US

reviews:
  profile: chill                  # assertive adds nitpick-level comments; this repo is research
                                  # code with deliberate one-off scripts, so chill fits better
  request_changes_workflow: false # reviews are advisory here; do not block merge
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false

  auto_review:
    enabled: true
    drafts: false

  # This repo commits its RESULTS next to its code: report dumps, figure PDFs/PNGs, corpus
  # tables. On the open PRs those outnumber the Python roughly 4:1 (PR #3 adds 157 data and
  # binary files against 42 .py), so without filters most of the review budget is spent
  # reading activation dumps instead of code.
  path_filters:
    # committed experiment output -- regenerated by the analysis scripts, never hand-edited
    - "!**/report/data/**"
    - "!**/report/tables/**"
    - "!**/results/**/figures/**"
    # vendored, not ours to review (delphi-4fea06e)
    - "!**/third_party/**"
    # binaries and bulk data: nothing reviewable in the diff
    - "!**/*.npz"
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.docx"
    - "!**/*.jsonl"

  path_instructions:
    - path: "verbalization/analysis/**/*.py"
      instructions: >
        These scripts regenerate figures and tables that are COMMITTED under
        verbalization/report/ and quoted with specific numbers in the write-up. Treat any
        change that could alter numeric output as a correctness issue, not a style one, and
        say so explicitly. Note in particular that passing `dpi` to a PDF save changes the
        embedded resolution of RASTERIZED content (imshow), so it is not a no-op for every
        figure. Shared helpers live in dumplib.py (dump/scan loaders, savefig, binning),
        featlib.py (SAE max-acts diagnostics) and style.py (palette); flag re-implementations
        of those rather than imports.
    - path: "**/*.py"
      instructions: >
        Research code. Single-use analysis scripts and hardcoded experiment paths are
        intentional and not worth flagging. Prioritise real defects: silent dtype or shape
        changes, off-by-one in binning or indexing, mutable default arguments, and resource
        leaks. Do not ask for type annotations or docstrings where the surrounding file has
        none.

chat:
  auto_reply: true
