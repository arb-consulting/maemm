    source: 2026-07-14_nla-av
    family: sae/sae2m/enc
    metric: ratio.bo1.median
    expect: 0.233
    tol: 0.002
    provenance: SMOKES.md 2026-09-21 SAE table, NLA n=4. Rounding tolerance.

  # ------------------------------------------------------------------------------------------
  # (4) Cross-set gates. A `kind: cross_set` gate reads ANOTHER set's product for the same
  # checkpoint and compares the two on the rows they share. `2026-09-21_v1raw` is `2026-09-16_v1`
  # re-forwarded row for row, so for a NON-CENTRABLE family the stored direction is identical in
  # both and the comparison is exact. `from_set` / `from_source` name the other side; only cosine
  # metrics resolve.
  # ------------------------------------------------------------------------------------------

  - name: old primary, sae rows, v1raw vs v1 on the shared rows
    kind: cross_set
    from_set: 2026-09-16_v1
    from_source: rl-8x2048-full@vllm
    source: rl-8x2048-full:mu-none
    family: sae/l42-1b
    metric: cos_raw.bo1
    tol: 0.01
    provenance: >-
      The `sae` family is not centrable, so both sets store unit(W_enc[:, f]) and `cos_raw` is
      the same statistic on both. The two runs differ in engine (vLLM there, HF here), n (64 vs
      4) and nothing else, so a difference is sampling, not convention. The tolerance is loose
      because n = 4 here.

  - name: old primary, realact rows, v1raw vs v1 on the shared rows
    kind: cross_set
    from_set: 2026-09-16_v1
    from_source: rl-8x2048-full@vllm
    source: rl-8x2048-full:mu-stats
    family: realact
    metric: cos_raw.bo1
    compare: false
    provenance: >-
      NOT the same statistic, and printed for the record only. `2026-09-16_v1` is `storage: unit`
      with its realact rows already centred on stats/mu.f32, so its `cos` has a CENTRED target
      and a raw scorer -- Celeste's asymmetry -- while a raw set's `cos` centres neither side.
      A tolerance here would assert a comparability that does not exist.

  - name: rl-last16, ctrl sae rows, v3_ctrl vs the 131k rows of v1raw
    kind: cross_set
    from_set: 2026-09-21_v1raw
    from_source: rl-last16
    source: rl-last16
    family: sae/l42-1b
    metric: cos_raw.bo1
    compare: false
    provenance: >-
      `2026-09-21_v3_ctrl` was built `--dirs-from …/2026-09-21_v1raw --rows 512-1535`, so its sae
      rows ARE v1raw's rows 1024-1535 -- but RENUMBERED, and this gate intersects on the row
      INDEX. So it compares v3_ctrl row r against v1raw row r, which are different targets, and
      it is `compare: false` for that reason: it exists to print the two numbers side by side
      while a row-mapping gate does not exist. `src_set` / `src_row` are on the v3_ctrl rows and
      are what a proper version of this would join on.

  - name: old primary v1 realact mean cos, 0.5076
    source: rl-8x2048-full
    family: realact
    metric: cos_raw.bo1
    expect: 0.5076
    compare: false
    provenance: >-
      SMOKES.md 2026-09-15, rows 0-7 of 2026-09-16_v1. NOT THE SAME STATISTIC as a raw set's
      `cos`: the stored 0.5076 is cos(h, unit(act - stats_mu)) -- target centred, scorer raw,
      Celeste's asymmetry -- and on a `storage: raw` set `score` produces cos (neither side
      centred) and cos_centred (both), never that third column. SMOKES.md 2026-09-21 records
      this as plan gate 2 being unevaluable rather than failed. Printed for the record with no
      verdict; delete the line or restate the gate against cos_centred once that is decided.
      The BARE selector is deliberate: on a set with two old-primary arms this resolves `absent`
      (matched 2 of the sources), which is right -- the 0.5076 belongs to neither arm.
