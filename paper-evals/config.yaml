# paper-evals: every model, SAE, MAEMM, target set and sampling constant used by precompute/.
#
# Keys `<base>/<name>` under `saes` and `maemms` are the directory names on the volume:
#   /vol/base/<base>/sae/<name>/ and /vol/maemms/<base>/<maemm>/.
# Base key spelling is `qwen36-27b` (infra/precompute-layout.md §1). An OLDER tree spelled
# `qwen3.6-27b` exists under /vol/maemms/ from a previous pipeline; it is not ours and not touched.
# Families are keyed BY NAME everywhere (never by list position) -- checklist item 38.

bases:
  qwen3-8b:
    hf: Qwen/Qwen3-8B
    read_layer: 27          # block OUTPUT of layer 27 (mxf/config.py profile qwen3-8b)
    d: 4096
    gpu: H100               # $3.95/h
    n_layers: 36
    # ||h|| at the marker of the inject layer under the CLEAN base, MEASURED 2026-09-15 by
    # rollouts_hf's marker check (bf16, so quantized). Only used for full-parameter MAEMMs, which
    # have no adapter to disable: see rollouts_hf.marker_check (checklist item 22).
    marker_norm_base: 14.5
    # Celeste's archived centring mean for this base, as a volume path. Used ONLY by the `mu_check`
    # / `mu_diag` diagnostics, which compare OUR stats/mu.f32 against hers; nothing centres on it
    # by virtue of being listed here (a product centres on the file its `mu:` / `--mu` names).
    whiten_mu: /vol/archive/gavento-1/data/run1/acts/whiten_mu.npy
  qwen36-27b:
    hf: Qwen/Qwen3.6-27B
    read_layer: 42          # mxf/config.py:6
    d: 5120
    gpu: H200               # $4.54/h
    n_layers: 64            # 48 of them GatedDeltaNet -> the image needs flash-linear-attention
    marker_norm_base: 14.062  # MEASURED 2026-09-15 by the rlI-150 rollouts run (see qwen3-8b above)
    whiten_mu: /vol/archive/gavento-1/data/qwen3.6-27b/whiten_mu.npy

# A MU IS A FILE (Tomáš, 2026-09-21). Everywhere a centring mean is named in this file or on a
# command line -- `maemms.<k>.mu`, `heldout.<set>.mu_stored`, `heldout.<set>.family_mu.<fam>`,
# `--mu` -- the value is one of:
#   null        subtract nothing: the input/stored direction is a RAW unit activation
#   <path>      a [d] float32 `.f32` or numpy `.npy` file. A path starting with `/` is absolute;
#               anything else is relative to the run's --root (so a smoke under /vol/runs/... gets
#               its own stats mean). `{base}` in the path expands to the base key, which is what
#               lets one held-out entry describe the set on either base.
#   unknown     (family_mu / mu_stored only) it arrived centred on a mean nobody here holds. Its
#               rows are returned with a label, never re-derived.
# There is no enum and no registry of mean NAMES: a new checkpoint trained on a new mean is a new
# path in a config entry, and nothing else has to change.

# NEW top level (2026-09-21): what a FAMILY is, independent of which set carries it.
# NOT `families:` -- that name is already the per-set key `heldout.<set>.families` (config.yaml
# below, read by common.families_for), and one name with two meanings in one file is exactly what a
# reader gets wrong once and never notices.
#   centrable: may a mean be subtracted from this family's rows at all? Only an ACTIVATION can be:
#              an encoder column, a Gaussian draw and a subspace basis have no mean to subtract, and
#              subtracting one anyway is a one-sided number, not a centred one.
#   kind:      what the row IS. `activation` is the only kind `targets` stores `act.f32` for.
family_kinds:
  realact:      {centrable: true,  kind: activation}
  realact_long: {centrable: true,  kind: activation}   # centred, mean UNVERIFIED -- see heldout.*.family_mu
  random:       {centrable: false, kind: synthetic}
  sae:          {centrable: false, kind: dictionary}
  sae2m_enc:    {centrable: false, kind: dictionary}   # the 2k set's legacy label; kept, not rewritten
  bsf:          {centrable: false, kind: subspace}
  jlens:        {centrable: false, kind: subspace}

saes:
  qwen3-8b/adamkarvonen-t2:
    hf: adamkarvonen/qwen3-8b-saes
    file: saes_Qwen_Qwen3-8B_batch_top_k/resid_post_layer_27/trainer_2/ae.pt
    layer: 27
    # The shipped max-activating windows the `repo_examples` product scores. NOT part of the SAE
    # repo: they live in adamkarvonen's separate `sae_max_acts` DATASET repo, 30 windows of 32
    # tokens per feature, and EVERY window carries the sink token at position 0 (her `_reencode`
    # prepends the tokenizer's eos; Qwen3-8B has no bos) -- hence sink_first: true, which
    # repo_examples asserts against the data before stripping column 0.
    max_acts:
      repo: adamkarvonen/sae_max_acts
      repo_type: dataset
      file: acts_Qwen_Qwen3-8B_layer_27_trainer_2_layer_percent_75_context_length_32.pt
      windows: 30
      sink_first: true
  qwen36-27b/l42-1b:
    # NOT ceselder/qwen36-27b-sae-l42 (the older repo master's code references): same width 131k
    # and k=64, 4x the training tokens. File list verified 2026-09-15 with list_repo_files.
    hf: ceselder/qwen36-27b-sae-l42-1b
    file: saes_Qwen_Qwen3.6-27B_batch_top_k/resid_post_layer_42/trainer_0/ae.pt
    layer: 42
    # Shipped inside the SAE repo itself (no `repo:` key -> the sae's own `hf`), 32 windows of 32
    # tokens per feature and NO sink prefix: position 0 is an ordinary corpus token, so all 32 ids
    # are scored and score_tokens prepends its own sink.
    max_acts:
      file: maxacts/acts_Qwen_Qwen3.6-27B_layer_42_trainer_0_context_length_32.pt
      windows: 32
      sink_first: false

  # The 2M SAE of the simple2m chain -- the dictionary the v2 checkpoint trains and is
  # evaluated on. Weights published 2026-09-20 (Ari); snapshot de89b1c1 on the volume.
  # From its own config.json / verify.json, not assumed:
  #   F 2,097,152, d 5120, k 64, learned gate 1.682811975479126
  #   EV 0.711, L0 67.45, 0 dead features, 100% fired over 20.0M eval tokens
  #   norm_factor 83.37198739567428 and norm_factor_folded EQUAL to it -- the
  #   normalisation is already folded into the shipped ae.pt, so raw layer-42
  #   residuals feed straight in with no rescaling. (This is exactly the ambiguity
  #   behind the OPEN 27B max-acts disagreement on l42-1b; here it is documented.)
  qwen36-27b/sae2m:
    hf: ceselder/qwen36-27b-sae2m-l42
    file: saes_Qwen_Qwen3.6-27B_batch_top_k/resid_post_layer_42/trainer_0/ae.pt
    layer: 42
    # 5 end-anchored 32-token windows per feature over a 1.0B-token scan. The buffer
    # convention is "[BOS]+ctx_len forwarded; BOS position dropped", so position 0 of a
    # stored window is an ordinary corpus token -> sink_first false, as on l42-1b.
    # UNVERIFIED: that maxacts_top5.pt has the same tensor layout repo_examples expects.
    max_acts:
      file: maxacts_top5.pt
      windows: 5
      sink_first: false

# `mu:` (NEW 2026-09-21) is what the checkpoint was TRAINED to receive at the marker: `null` = a
# unit activation with nothing subtracted, a path = a unit `act - mu` under the mean in that file.
# It is the ONLY thing that tells `rollouts_*` / `score` which direction to hand a MAEMM, and every
# such product takes `--mu <file>` to override it (recorded as a deviation). An entry with NO `mu:`
# key cannot be run through a centring-aware product at all -- `common.input_mu` refuses rather
# than guessing -- which is where the older 8B/LoRA entries sit: their training banks' convention
# has never been established and inferring one from the file layout would be a guess wearing a
# config key's authority. An explicit `mu: null` is a STATEMENT; an absent key is a gap.
#
# `compute: false` (default true) means the entry is DECLARED but nothing is generated for it in
# this pipeline: it exists so the paper's model table, the prompt inventory and the `check` product
# know about it. common.maemms_for() filters these out of every "all MAEMMs" iteration; `check`
# resolves them too, but LENIENTLY -- an entry nobody computes need not be in the volume's HF cache.
maemms:
  qwen3-8b/2026-09-03_run1-rl:
    type: lora
    src: /vol/archive/gavento-1/runs/run1/rl/final    # volume path, not an HF repo
    prompt: ours8b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 64
  qwen36-27b/2026-09-08_rlI-150:
    type: lora
    hf: ceselder/maemm-qwen36-27b-inverter-rlI-step150
    subdir: step_150        # adapter_config.json lives here, not at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96
  qwen36-27b/2026-09-10_rl-8x2048-full:
    type: full              # 12 safetensors shards at the repo root; scoring uses the clean base
    hf: ceselder/qwen36-27b-maemm-inverter-rl-8x2048
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 192
    # UNESTABLISHED, and declared as such (Tomáš, 2026-09-21). `unknown` is not `null`: it says
    # this checkpoint's training convention is not on the record, so no product will pick one for
    # it and every run must be told with `--mu` (common.input_mu / mu_for refuse otherwise).
    #
    # The evidence points both ways. The eval plan (§1.1, §2.2) declares `none`, from Tomáš's
    # recollection that the 09-10 chain took uncentred input. Against that: Celeste's ORIGINAL
    # convention was targets `unit(act - whiten_mu)` with a RAW scorer (observations §2 -- she
    # diagnosed the asymmetry herself in f9b5095 on 09-18, after this checkpoint launched), and
    # the one number this checkpoint has on our volume -- cos_raw 0.5076 on rows 0-7 of
    # `2026-09-16_v1` -- was measured against rows stored as `unit(X[p] - stats/mu.f32)`, which is
    # a stats_mu-centred input, not a raw one.
    #
    # SETTLED EMPIRICALLY by the §1.6 smoke, not by argument: it runs two old-primary arms on the
    # SAME rows, `--mu null` and `--mu base/{base}/stats/mu.f32`. The plan's reproduction check
    # ("cos_raw within 0.01 of 0.5076") applies to the stats_mu arm ONLY -- it is a reproduction
    # of a stats_mu run. Whichever arm scores higher becomes the declared `mu:` here, with the
    # number recorded beside it.
    mu: unknown
    primary: true           # Tomas 2026-09-16: the primary MAEMM; rlI-150 and 8B run1 are secondary rows
  # The v2 / simple2m checkpoint (Ari 2026-09-19: the one to use for the experiments).
  # Full-parameter, 12 bf16 shards + model-nontext.safetensors, 55.6 GB. Weight identity
  # to pin: sha a1e4f299e0100a9340077c395504487375a63eec (config has no `revision:` key;
  # common.py asserts a single snapshot in the cache, so fetch that one and only that one).
  qwen36-27b/2026-09-18_rl-last16-lr5e-7:
    type: full
    hf: ceselder/maemm-27b-rl-last16-lr5e-7
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96
    train_data: celeste-v2-2026-09-17
    # unit(act - whiten_mu) on realact rows; SAE rows are raw encoder/decoder columns either way
    # (they are not centrable at all, family_kinds above). ESTABLISHED: both of this checkpoint's
    # chains -- SFT bank ufw_ctx8_64_sft_4m_v3 and RL pool ufw_ctx64_2048_rl_500k_v3 -- were built
    # with Celeste's whiten_mu (infra/2026-09-21_observations.md §2). MEASURED 2026-09-16
    # (SMOKES.md:871): cos(our mu_512, this file) = 0.999897 on the 27B. The archived file is the
    # EARLIER chain's and the v2 bundle ships no mu, so "is this the mean she used" is one line to
    # Celeste, not a gate.
    mu: /vol/archive/gavento-1/data/qwen3.6-27b/whiten_mu.npy
    # RL reward = max cosine over the LAST 16 generated tokens (--reward-window-last 16,
    # confirmed by Ari 2026-09-19), not the whole span. lr 5e-7 flat after a 25-step
    # warmup, 300 steps, 8x2048 per step, CISPO/GRPO. SFT init: the 8M-row simple2m mix.
    # UNVERIFIED, both to be settled by the marker/greedy smoke before any paid run:
    #   prompt        `celeste27b` is ASSUMED. The prompt is per-MAEMM special casing
    #                 verified against each MAEMM's training code once; that has NOT been
    #                 done for the simple2m chain. A one-token difference shifts the mean
    #                 ~0.01 and is invisible to any distribution comparison (docs/, 3).
    #   train_max_new 96 is from run_meta.json["argv"], which is STALE on three other
    #                 fields (lr, reward window, init adapter) and so is not a source.
    #   marker_norm   never measured for this checkpoint; bases.marker_norm_base 14.062 is
    #                 the CLEAN base, and rollouts_hf.marker_check uses a divergence from
    #                 it to prove a full-parameter MAEMM actually loaded.
    # Not `primary: true` yet -- that demotes 2026-09-10_rl-8x2048-full and is Ari's call.
    # Note this checkpoint's provenance is strictly better: Ultra-FineWeb en throughout
    # with explicit doc ranges, against the current primary's unpinned FineFineWeb.
  qwen36-27b/2026-09-16_base-control:
    type: base              # the CLEAN base, no MAEMM weights: the untrained-base control
    hf: Qwen/Qwen3.6-27B    # the same snapshot bases.qwen36-27b resolves to
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    role: control           # stats.py: shown as "control" between the primary and the secondaries
    # The control's whole definition is "the primary with base weights", so it takes the primary's
    # input convention too: anything else would make it a control for a different experiment.
    mu: null
    # No train_max_new: nothing was trained. Everything else -- prompt, marker, inject layer/coef
    # and the `rollouts:` sampling block -- is the primary's, so the only difference from
    # 2026-09-10_rl-8x2048-full is the weights.
    note: untrained-base control for the primary (2026-09-10_rl-8x2048-full); identical prompt, marker, injection and sampling, base weights only
  # The NLA activation-verbalizer baseline (Natural Language Autoencoder, EasyNLA / nanoNLA
  # recipe, github.com/asherps/EasyNLA). NOT a MAEMM: a FULL merged bf16 Qwen3_5ForCausalLM
  # (2 shards, 53.8 GB, model.safetensors.index.json present, tokenizer + chat_template.jinja +
  # generation_config.json + nla_meta.yaml shipped) trained to VERBALIZE a layer-42 activation --
  # warm-start SFT on ceselder/qwen3-8b-nla-L24-finefineweb-100k explanations, then GRPO against a
  # reconstruction reward; the card claims held-out FVE ~= 75%. It is a `maemms:` entry because it
  # shares everything the layout and the objective need: it is served like a `type: full` MAEMM,
  # it takes ONE direction at ONE marker token of block 1's output under the same Karvonen
  # norm-matched add, and its rows land in maemms/<base>/<entry>/{rollouts,scores} and go through
  # the ONE clean-base scoring path (README "Methods"). What it does NOT share is the prompt, the
  # marker and the output format, so `rollouts_nla` is its only generator and every product that
  # injects with the MAEMM prompt (rollouts_hf, rollouts_vllm, parity_greedy) REFUSES type nla.
  qwen36-27b/2026-07-14_nla-av:
    type: nla
    hf: ceselder/qwen3.6-27b-nla-av
    revision: def1421d20fd949f9da13bfeeba1b600b31a654f   # asserted against the cached snapshot's dir name
    inject: {layer: 1, coef: 1.0}     # Karvonen norm-matched add at block-1 output, as the MAEMMs
    nla:
      # tokens: block of nla_meta.yaml on the checkpoint. The hook injects ONLY where
      # ids[p-1] == left_id and ids[p+1] == right_id (nla/injection.py), so the neighbours are
      # part of the contract, not a diagnostic. The marker is NOT the last prompt token.
      marker: "㈜"
      marker_id: 158983
      left_id: 29
      right_id: 510
      # nla_meta.yaml prompt_templates.actor, VERBATIM; rollouts_nla.check_sidecar asserts this is
      # equal to the shipped sidecar's text (after strip) before it generates anything.
      template: |
        You are a meticulous AI researcher conducting an important investigation into activation vectors from a language model. Your overall task is to describe the semantic content of that activation vector.

        We will pass the vector enclosed in <concept> tags into your context. You must then produce an explanation for the vector, enclosed within <explanation> tags. The explanation consists of 2-3 text snippets describing that vector.

        Here is the vector:

        <concept>{injection_char}</concept>

        Please provide an explanation.
      # SAMPLING: the shared `rollouts:` block, like every MAEMM arm (Tomas + Juan 2026-09-21).
      # The checkpoint ships top_p 0.95 / top_k 20 in generation_config.json; that is not a
      # convention anywhere and is recorded on the summary but NOT used. No nla.sampling key.
      # Tomas 2026-09-21: the NLA arm generates at the checkpoint's NATIVE length. That is what the
      # model card's own invocation uses and what the verbalizer's <explanation> answers are shaped
      # like; cutting them at the pipeline's 64 would report this baseline on a fraction of its
      # output. It costs the arm its comparability on generation length with the MAEMM arms, which
      # is stated wherever the number appears rather than hidden.
      max_new: 200
      # The re-encode truncation `score` uses FOR THIS ARM, carried to it on the rollouts summary
      # (common.encode_for_score / score_width_of; every other arm stays at SCORE_MAX_LENGTH = 95).
      # 256 leaves room for the 200 generated tokens plus the sink plus re-tokenization expansion
      # -- a decoded rollout does not always re-encode to the same id count (README, checklist
      # item 8). A cosine from this arm is therefore a max over a WIDER window than the others'.
      score_max_tokens: 256
      card_max_new: 200      # the reference script's own default and the card's invocation
      n: 4                   # texts per target, default; --n overrides
      # Tomas 2026-09-21: `raw` is the HEADLINE input -- the scorer's own target direction, fed as
      # is, which is also what every MAEMM arm is injected with, so the NLA column is read against
      # them on the same input rather than on a reconstruction only this arm gets. `exact` and `mu`
      # are the VARIANTS, run with --amp into variants/<set>__amp-<amp>/. NOTE the realact smoke
      # rows already on the volume were generated under the old `exact` default; their summaries
      # record `amp` per run and per row, so which is which is never in doubt.
      amp: raw               # default input-amplitude convention; --amp overrides (writes a variant dir)
      amp_r: median          # r for `mu`/`raw` and the `exact` fallback: layer read_layer q[0.5] of stats/resid_norm_quantiles.json, or a number
    # Raw layer-42 block output, NO centring (the card and nla_meta.yaml; observations §5).
    # `nla.amp` stays the AMPLITUDE knob and is a different axis from this one: `mu` says which
    # mean is subtracted from the activation, `amp` says what norm the injected vector gets.
    mu: null
    compute: true
  qwen36-27b/2026-09-05_rlE-250:
    type: lora
    hf: ceselder/maemm-qwen36-27b-inverter-rlE-step250   # adapter at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96       # ASSUMED: mxf/config.py:72 RLConfig.max_new_tokens for the LoRA chain
    compute: false

  # --- declared only (compute: false): nothing is generated for these today ---------------------
  qwen3-8b/2026-09-03_run1-sft:
    type: lora
    src: /vol/archive/gavento-1/runs/run1/sft/final      # volume path, not an HF repo
    prompt: ours8b
    inject: {layer: 1, coef: 1.0}
    compute: false
    note: the SFT checkpoint run1's RL chain started from
  qwen36-27b/2026-09-05_init-realact23m-sft:
    type: lora
    hf: ceselder/maemm-init-realact23m-sft
    subdir: sft_final       # adapter_config.json lives here, not at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    compute: false
  qwen36-27b/2026-09-09_pretrain-104m-full:
    type: full
    hf: ceselder/qwen36-27b-maemm-inverter-pretrain-104m
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    compute: false
    note: the full-parameter line's published init

# NEW per-set keys (2026-09-21): the STORAGE CONTRACT of a set on disk. They say what `vecs.f16`
# holds, which is the one thing a reader cannot tell by looking at it.
#   storage: raw       -- `act.f32` is present and every direction is DERIVED at read time; nothing
#                         stored encodes a centring choice. This is what `targets` writes from now
#                         on, and what `common.dirs_for` can serve under ANY `--mu`.
#            unit      -- `vecs.f16` is a stored unit direction under some mean. It can be served
#                         only at the mean it was built with: without `act.f32` (or a raw
#                         `act_norm` to solve with) un-centring is not possible.
#            dirs_only -- `vecs.f16` is a direction that was never centred and never could be
#                         (an encoder column, a Gaussian draw, a subspace basis).
#   mu_stored:  the mean the WHOLE set was centred on, as a FILE PATH (see "A MU IS A FILE"), or
#               null when it is not one mean for the whole set.
#   family_mu:  per family, for a `storage: unit` set whose families do not share one convention.
#               null = that family was never centred; `unknown` = it arrived centred on a mean
#               nobody here holds, and `dirs_for` returns it with a label instead of a number
#               anyone can re-derive.
# A set written before these keys existed is described here, not rewritten in place.
heldout:
  2026-09-16_v1:
    # Drawn 2026-09-16, BEFORE the raw-storage rule: its realact rows are stored already centred.
    storage: unit
    mu_stored: null           # not one mean for the whole set -- per family below
    family_mu:
      # `{base}` expands to the base key, so one entry describes the set on either base.
      realact: base/{base}/stats/mu.f32   # targets.py stored unit(X[p] - stats/mu.f32)
      random:  null           # a torch.randn draw; nothing was ever subtracted
      sae:     null           # unit(W_enc[:, f]); an encoder column has no mean
      jlens:   null           # declared-empty slot, zero rows
    seed: 20260916
    families:
      realact: {n: 512}
      random:  {n: 512}
      sae:     {n: 512}
      # No J-lens matrix exists on either base yet: the slot is declared so the set's shape is
      # stable, and `status: empty` means targets.py writes zero rows for it.
      jlens:   {n: 512, bases: [qwen36-27b], status: empty}
    # (`realact_len: [1, 64]` was deleted 2026-09-21: dead since targets.py landed, which takes
    # L ~ U[SPAN_MIN, SPAN_MAX] = U[16, 64] from its own module constants and never read this key.)
    sae_min_fires: 20       # counted with the SAE's learned gate, not raw act > 0
    sae_strata: 4           # rarity quartiles of the corpus fire count

  # The RAW re-derive of 2026-09-16_v1 (2026-09-21). Same seed, same families, same sizes, same
  # sae parameters -- `targets --re-derive` asserts all of that from config before it touches a
  # GPU, because the rng stream is what makes "the same rows" true. What differs is the STORAGE:
  # act.f32 + unit(act), with the mean applied at read time. `2026-09-16_v1` is not modified,
  # replaced or removed by this; a re-derive only ever CREATES a set.
  2026-09-21_v1raw:
    # `imported: true` here means "nameable, never the default" (common.default_heldout's own
    # words), NOT "drawn elsewhere". Without it this entry becomes sorted()[-1] and every product
    # called without --set silently moves off `2026-09-16_v1`, which is the set the paper's tables
    # are built on -- and onto a set that does not exist on the volume until `targets` has run.
    # Drop the flag deliberately, in its own commit, when this set is adopted as the default.
    imported: true
    storage: raw
    mu_stored: null           # nothing stored is centred; --mu decides per run
    seed: 20260916            # == 2026-09-16_v1, asserted
    families:
      realact: {n: 512}
      random:  {n: 512}
      sae:     {n: 512}
      jlens:   {n: 512, bases: [qwen36-27b], status: empty}
    sae_min_fires: 20
    sae_strata: 4

  # DRAWN, not drawn here: Ari's `features/draw_sae2m.py` wrote this set on 2026-09-20 (commit
  # b767d1a, its own README on the volume) through `features/spawn.py`, which calls the Modal
  # function directly and so BYPASSES `modal_app.main`'s "set_name in cfg['heldout']" assert --
  # which is why the set exists on the volume without ever having been declared here. Declaring it
  # now lets `--set 2026-09-20_sae2m_2k` through the entrypoint.
  #
  # `imported: true` keeps it OUT of the default-set rule: `sorted(cfg["heldout"])[-1]` would make
  # this 2,000-row sae2m set the default of every product that omits --set, silently moving
  # `2026-09-16_v1` off the tables. `common.default_heldout` takes the latest NON-imported set
  # instead, and every entrypoint uses it.
  #
  # The family label here is `sae2m_enc` because that is what the rows ON THE VOLUME carry, and
  # this file describes what exists. `features/draw_sae2m.py` emits `family: "sae"` -- the label
  # every consumer actually filters on -- with the dictionary named per row in `sae_key`; the 2k
  # set below predates that and is NOT rewritten in place, so autointerp keeps accepting the old
  # label for it (FAMILIES in sae_self.py/build.py). A RE-DRAW carries `sae`.
  # SETTLED 2026-09-21 by reading the volume (`modal volume get maemm
  # base/qwen36-27b/heldout/2026-09-20_sae2m_2k/ids.jsonl`): all 2,000 rows carry
  # `family: "sae2m_enc"` and NO `sae_key` field. Ari's 541b4b0 declares
  # `families: {sae: {n: 2000}}` for this same set, which does not match what is on disk; this
  # line does. A re-draw under the current draw_sae2m carries `sae` + `sae_key` and needs a new
  # config entry, not an edit of this one.
  2026-09-20_sae2m_2k:
    imported: true
    storage: dirs_only        # 2,000 unit encoder columns; nothing here was ever centred
    mu_stored: null
    seed: 20260920            # scan's reservoir generator seeds off this
    families:
      sae2m_enc: {n: 2000, bases: [qwen36-27b]}   # 2M-SAE encoder columns, UNCENTRED (no mu)

  # The 131k-SAE counterpart of the 2,000-feature 2M set, drawn by
  # features/draw_sae131k.py from pool_heldout/sae.parquet (13,107 features the EARLIER
  # chains held out). Same shape and same 80/20 column, so the only difference between
  # the two sets is the dictionary -- which is what makes the contrast measurable.
  # Its held-out claim is WEAKER than the 2M set's and says so per row: it was
  # established against the earlier chains, and near-duplication against the 1.85M 2M
  # features the v2 checkpoint trained on is not established.
  2026-09-21_sae131k_2k:
    seed: 20260921
    families:
      sae: {n: 2000}
    sae_min_fires: 20
    sae_strata: 4

corpus:
  dataset: openbmb/Ultra-FineWeb
  # PINNED (D9, 2026-09-21). Streaming at `main` was the one violation of this branch's own
  # no-unpinned-data rule: the published dataset can gain or reorder rows, and every doc id, scan
  # window and top-k list on the volume indexes into the exact parquet bytes this corpus was built
  # from. `null` here means "unpinned" and corpus.py REFUSES it -- resolve the revision (the
  # dataset's current commit sha on the hub) and put it in, do not delete the key.
  # The parquet sha256 of each part lands in the corpus README at build time.
  revision: main
  files:
    - data/ultrafineweb_en/ultrafineweb-en-part-0009-of-2048.parquet
    - data/ultrafineweb_en/ultrafineweb-en-part-0010-of-2048.parquet
  tokens: 16000000          # 16M; nested subsets below are in MILLIONS of tokens
  sizes: [1, 2, 4, 8, 16]
  seed: 20260916

# NEW top level (2026-09-21): every built corpus, by KEY. `corpus:` above stays as the BUILD recipe
# of the original 16M held-out slice; this block is what a product names when it has to choose one.
#   dir:   the directory under base/<base>/ -- "corpus" is the original unnamed one, anything else
#          is corpora/<dir>/ (common.corpus_dir's `name`, Ari's --corpus-name).
#   sizes: the nested snapshot ladder actually built, in MILLIONS of tokens; may be fractional.
#   block/stride: the window geometry the scans over it use. A DIFFERENT geometry or ladder is a
#          DIFFERENT corpus, never an edit: every stored scan window and top-k list indexes into
#          one exact tokens.i32, and a rebuild in place silently invalidates all of them.
# A number from one corpus is not comparable with a number from another. Products take
# `--corpus <key>`, which resolves through here to `--corpus-name`.
corpora:
  heldout16m:
    dir: corpus                     # base/<base>/corpus/, the original directory
    sizes: [1, 2, 4, 8, 16]
    block: 64
    stride: 16
    dataset: openbmb/Ultra-FineWeb
    note: >-
      OUR held-out slice (parts 0009/0010), built by `--product corpus`. Text the checkpoints did
      not train on, so a corpus-search win here IS evidence about unseen text.
  celeste-train10m:
    dir: train_parity_10m           # base/<base>/corpora/train_parity_10m/
    sizes: [1.25, 2.5, 5, 10]
    block: 32
    stride: 8
    dataset: openbmb/Ultra-FineWeb
    note: >-
      Ari 2026-09-20, features/corpus_train_parity.py: the checkpoint's OWN training document
      ranges (sft 5,500,001-5,698,523 and rl 9,500,000-9,599,841), 10M tokens at a 1.25/2.5/5/10M
      ladder for parity with training, which saw 9-10M activations. It hands the search text the
      model may have MEMORISED, so a win here is NOT evidence that retrieval beats generation on
      unseen text -- the two claims must not be swapped. Her eval realacts are documents
      [0, 100,000), so a target's own document cannot leak in. Window 32/8, NOT the 64/16 of
      heldout16m: no number from the two corpora is comparable.

rollouts:
  n: 64                     # rollouts per target
  temperature: 1.0
  max_new: 64
  min_new: 16
  top_p: 1.0
  top_k: 0
  seed: 1234                # rl/rl.py GEN_SEED

modal:
  volume: maemm
  hf_home: /vol/hf
  archive: /vol/archive/gavento-1        # read-only by convention
  secrets: [hf-write]

# ---------------------------------------------------------------------------------------------
# The Delphi-style SAE autointerp evaluation (`autointerp/`, design
# infra/2026-09-16_autointerp-design.md). APPENDED 2026-09-16; nothing above this line changed.
# Models are ANTHROPIC ids (Tomas 2026-09-16: the direct Messages API, not OpenRouter, so no
# `anthropic/` prefix). NOTE `temperature` below is recorded for the protocol but NOT SENT: the
# parameter does not exist on the Anthropic Messages API for this model generation.
autointerp:
  explainer_model: claude-sonnet-5
  scorer_model: claude-sonnet-5
  # RECORDED, NOT SENT. `anthropic` 1.6.0's messages.create() has no `temperature` parameter for
  # this model generation (MEASURED 2026-09-16: TypeError), so the design's "temperature 0" is not
  # achievable on this API. Kept here as the protocol's stated intent; run.py asserts it is absent
  # from every request body and says so in costs.json.
  temperature: 0.0
  # 600, not the lifted 300: MEASURED 2026-09-16 on the Anthropic API, 3 of 18 explainer
  # answers hit a 300-token cap and had to be retried under A10. Output tokens are billed
  # by use, so a higher cap costs nothing unless it is used, while a retry pays the whole
  # 2.4k-token input again.
  explainer_max_tokens: 600
  scorer_max_tokens: 600        # MEASURED 2026-09-15: 64 and 300 truncate the narrating judge
  n_examples: 16                # N in the substitution arms; ARM_SPECS pins every per-arm count
  scorer_batch: 5               # Delphi's num_examples_per_scorer_prompt
  n_pos: 20                     # test positives, 5 from each of the four stored activation bands
  n_neg: 20                     # test negatives, zero-activation windows of the shared _random256
  corpus_prefix_m: 4            # the "cheap corpus" nested size, in MILLIONS of tokens
  pilot_features: 64            # 16 per density quartile
  # RUN SCALE (Tomáš, 2026-09-21): the eval runs at **32 features per SAE** for now -- passed as
  # `--n-feat 32` on the `build` stage, not a key here, because it is a per-run choice and not a
  # protocol constant. The 09-21 plan's 256 (2M) + 128 (131k) is superseded. Companion decisions,
  # recorded in SMOKES.md's runbook: GCG/EPO at 16 directions, patchscopes on Ari's implementation
  # (7f3b511, do not write another), OOD at 1/4 of the design's size.
  feat_seed: 1234
  shuffle_seed: 20260916        # test-item order and the C4M mix; per feature, so arms stay paired
  concurrency: 32
  timeout_s: 90.0
  max_cost_usd: 400.0           # hard ceiling on one `run` call's API spend (total budget ~$500)
  probe_features: 8             # UNUSED since 2026-09-16: every stage is now projected with
                                # messages.count_tokens BEFORE it is submitted, which lands before
                                # any money is spent rather than after eight features.
  # --- AMENDMENTS 2026-09-16 (coordinator, after two design reviews) --------------------------
  # The shared negative pool: scan's `_random256` carries 256 windows and only a per-feature
  # MAXIMUM, and 14 of the densest tested features cannot supply 20 zero-activation negatives from
  # it. `random_pool` re-draws 2048 windows and stores per-token activations, which also makes
  # near-miss negatives (0 < max <= gate) available at no extra cost.
  random_pool_windows: 2048
  random_pool_seed: 20260916
  # Negative mix, summing to n_neg (amendment A5): 10 zero-activation windows (Delphi's published
  # `non_activating_source "random"`, which stays the reference) + 10 near-miss windows with
  # 0 < peak <= gate, which is what keeps the negative side off its ceiling. Every test row carries
  # `src`, so the two halves are also reported apart.
  n_neg_nearmiss: 10
  # Where a near-miss negative comes from: `qband` = the stored q0..q3 rows that fall BELOW the
  # gate (which gate-consistent positives release), `random` = the random pool's 0 < max <= gate
  # windows.
  nearmiss_source: qband
  # Test positives are GATE-CONSISTENT: only a window whose stored peak pre-gate activation
  # exceeds the SAE gate counts as a positive, and the band draw runs over gate-passing rows only.
  gate_consistent_positives: true
  # When the q-bands cannot supply n_pos gate-passing windows, fall back to the top-ranked windows
  # BEYOND the ones any arm shows. Counted and flagged per feature, never silent.
  allow_top_fallback: true
  # The scorer-only floor arm: each feature's test set scored with another feature's description,
  # under the same scorer prompts. No explainer call of its own.
  floor_arm: R-shuffled
  floor_source_arm: C16
  # The JUDGE-ONLY floor (coordinator, 2026-09-16): draw 1 of C16 scored a SECOND time with the
  # SAME description, scorer calls only. `C16-draw2` mixes judge variation with test-set-draw
  # variation; this one isolates the judge half, which matters more now that the API has no
  # temperature parameter and nothing is deterministic.
  judge_floor_arm: C16-judge2
  # --- Anthropic Messages API (Tomas 2026-09-16, replacing OpenRouter) ------------------------
  # `sync` = messages.create through a bounded thread pool; `batch` = one Message Batch per stage
  # at HALF price, latency measured on the pilot before the full run commits to it.
  path: sync
  # Refuse to run a stage projecting more than this without --approved. The projection comes from
  # messages.count_tokens on a sample of the uncached jobs, so it lands before any money is spent.
  stop_above_usd: 100.0
