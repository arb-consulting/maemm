# paper-evals: every model, SAE, MAEMM, target set and sampling constant used by precompute/.
#
# Keys `<base>/<name>` under `saes` and `maemms` are the directory names on the volume:
#   /vol/base/<base>/sae/<name>/ and /vol/maemms/<base>/<maemm>/.
# Base key spelling is `qwen36-27b` (infra/precompute-layout.md §1). An OLDER tree spelled
# `qwen3.6-27b` exists under /vol/maemms/ from a previous pipeline; it is not ours and not touched.
# Families are keyed BY NAME everywhere (never by list position) -- checklist item 38.

bases:
  qwen3-8b:
    hf: Qwen/Qwen3-8B
    read_layer: 27          # block OUTPUT of layer 27 (mxf/config.py profile qwen3-8b)
    d: 4096
    gpu: H100               # $3.95/h
    n_layers: 36
    # ||h|| at the marker of the inject layer under the CLEAN base, MEASURED 2026-09-15 by
    # rollouts_hf's marker check (bf16, so quantized). Only used for full-parameter MAEMMs, which
    # have no adapter to disable: see rollouts_hf.marker_check (checklist item 22).
    marker_norm_base: 14.5
  qwen36-27b:
    hf: Qwen/Qwen3.6-27B
    read_layer: 42          # mxf/config.py:6
    d: 5120
    gpu: H200               # $4.54/h
    n_layers: 64            # 48 of them GatedDeltaNet -> the image needs flash-linear-attention
    marker_norm_base: 14.062  # MEASURED 2026-09-15 by the rlI-150 rollouts run (see qwen3-8b above)

saes:
  qwen3-8b/adamkarvonen-t2:
    hf: adamkarvonen/qwen3-8b-saes
    file: saes_Qwen_Qwen3-8B_batch_top_k/resid_post_layer_27/trainer_2/ae.pt
    layer: 27
    # The shipped max-activating windows the `repo_examples` product scores. NOT part of the SAE
    # repo: they live in adamkarvonen's separate `sae_max_acts` DATASET repo, 30 windows of 32
    # tokens per feature, and EVERY window carries the sink token at position 0 (her `_reencode`
    # prepends the tokenizer's eos; Qwen3-8B has no bos) -- hence sink_first: true, which
    # repo_examples asserts against the data before stripping column 0.
    max_acts:
      repo: adamkarvonen/sae_max_acts
      repo_type: dataset
      file: acts_Qwen_Qwen3-8B_layer_27_trainer_2_layer_percent_75_context_length_32.pt
      windows: 30
      sink_first: true
  qwen36-27b/l42-1b:
    # NOT ceselder/qwen36-27b-sae-l42 (the older repo master's code references): same width 131k
    # and k=64, 4x the training tokens. File list verified 2026-09-15 with list_repo_files.
    hf: ceselder/qwen36-27b-sae-l42-1b
    file: saes_Qwen_Qwen3.6-27B_batch_top_k/resid_post_layer_42/trainer_0/ae.pt
    layer: 42
    # Shipped inside the SAE repo itself (no `repo:` key -> the sae's own `hf`), 32 windows of 32
    # tokens per feature and NO sink prefix: position 0 is an ordinary corpus token, so all 32 ids
    # are scored and score_tokens prepends its own sink.
    max_acts:
      file: maxacts/acts_Qwen_Qwen3.6-27B_layer_42_trainer_0_context_length_32.pt
      windows: 32
      sink_first: false

  # The 2M SAE of the simple2m chain -- the dictionary the v2 checkpoint trains and is
  # evaluated on. Weights published 2026-09-20 (Ari); snapshot de89b1c1 on the volume.
  # From its own config.json / verify.json, not assumed:
  #   F 2,097,152, d 5120, k 64, learned gate 1.682811975479126
  #   EV 0.711, L0 67.45, 0 dead features, 100% fired over 20.0M eval tokens
  #   norm_factor 83.37198739567428 and norm_factor_folded EQUAL to it -- the
  #   normalisation is already folded into the shipped ae.pt, so raw layer-42
  #   residuals feed straight in with no rescaling. (This is exactly the ambiguity
  #   behind the OPEN 27B max-acts disagreement on l42-1b; here it is documented.)
  qwen36-27b/sae2m:
    hf: ceselder/qwen36-27b-sae2m-l42
    file: saes_Qwen_Qwen3.6-27B_batch_top_k/resid_post_layer_42/trainer_0/ae.pt
    layer: 42
    # 5 end-anchored 32-token windows per feature over a 1.0B-token scan. The buffer
    # convention is "[BOS]+ctx_len forwarded; BOS position dropped", so position 0 of a
    # stored window is an ordinary corpus token -> sink_first false, as on l42-1b.
    # UNVERIFIED: that maxacts_top5.pt has the same tensor layout repo_examples expects.
    max_acts:
      file: maxacts_top5.pt
      windows: 5
      sink_first: false

# `compute: false` (default true) means the entry is DECLARED but nothing is generated for it in
# this pipeline: it exists so the paper's model table, the prompt inventory and the `check` product
# know about it. common.maemms_for() filters these out of every "all MAEMMs" iteration; `check`
# resolves them too, but LENIENTLY -- an entry nobody computes need not be in the volume's HF cache.
maemms:
  qwen3-8b/2026-09-03_run1-rl:
    type: lora
    src: /vol/archive/gavento-1/runs/run1/rl/final    # volume path, not an HF repo
    prompt: ours8b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 64
  qwen36-27b/2026-09-08_rlI-150:
    type: lora
    hf: ceselder/maemm-qwen36-27b-inverter-rlI-step150
    subdir: step_150        # adapter_config.json lives here, not at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96
  qwen36-27b/2026-09-10_rl-8x2048-full:
    type: full              # 12 safetensors shards at the repo root; scoring uses the clean base
    hf: ceselder/qwen36-27b-maemm-inverter-rl-8x2048
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 192
    primary: true           # Tomas 2026-09-16: the primary MAEMM; rlI-150 and 8B run1 are secondary rows
  # The v2 / simple2m checkpoint (Ari 2026-09-19: the one to use for the experiments).
  # Full-parameter, 12 bf16 shards + model-nontext.safetensors, 55.6 GB. Weight identity
  # to pin: sha a1e4f299e0100a9340077c395504487375a63eec (config has no `revision:` key;
  # common.py asserts a single snapshot in the cache, so fetch that one and only that one).
  qwen36-27b/2026-09-18_rl-last16-lr5e-7:
    type: full
    hf: ceselder/maemm-27b-rl-last16-lr5e-7
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96
    train_data: celeste-v2-2026-09-17
    # RL reward = max cosine over the LAST 16 generated tokens (--reward-window-last 16,
    # confirmed by Ari 2026-09-19), not the whole span. lr 5e-7 flat after a 25-step
    # warmup, 300 steps, 8x2048 per step, CISPO/GRPO. SFT init: the 8M-row simple2m mix.
    # UNVERIFIED, both to be settled by the marker/greedy smoke before any paid run:
    #   prompt        `celeste27b` is ASSUMED. The prompt is per-MAEMM special casing
    #                 verified against each MAEMM's training code once; that has NOT been
    #                 done for the simple2m chain. A one-token difference shifts the mean
    #                 ~0.01 and is invisible to any distribution comparison (docs/, 3).
    #   train_max_new 96 is from run_meta.json["argv"], which is STALE on three other
    #                 fields (lr, reward window, init adapter) and so is not a source.
    #   marker_norm   never measured for this checkpoint; bases.marker_norm_base 14.062 is
    #                 the CLEAN base, and rollouts_hf.marker_check uses a divergence from
    #                 it to prove a full-parameter MAEMM actually loaded.
    # Not `primary: true` yet -- that demotes 2026-09-10_rl-8x2048-full and is Ari's call.
    # Note this checkpoint's provenance is strictly better: Ultra-FineWeb en throughout
    # with explicit doc ranges, against the current primary's unpinned FineFineWeb.
  qwen36-27b/2026-09-16_base-control:
    type: base              # the CLEAN base, no MAEMM weights: the untrained-base control
    hf: Qwen/Qwen3.6-27B    # the same snapshot bases.qwen36-27b resolves to
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    role: control           # stats.py: shown as "control" between the primary and the secondaries
    # No train_max_new: nothing was trained. Everything else -- prompt, marker, inject layer/coef
    # and the `rollouts:` sampling block -- is the primary's, so the only difference from
    # 2026-09-10_rl-8x2048-full is the weights.
    note: untrained-base control for the primary (2026-09-10_rl-8x2048-full); identical prompt, marker, injection and sampling, base weights only
  # The NLA activation-verbalizer baseline (Natural Language Autoencoder, EasyNLA / nanoNLA
  # recipe, github.com/asherps/EasyNLA). NOT a MAEMM: a FULL merged bf16 Qwen3_5ForCausalLM
  # (2 shards, 53.8 GB, model.safetensors.index.json present, tokenizer + chat_template.jinja +
  # generation_config.json + nla_meta.yaml shipped) trained to VERBALIZE a layer-42 activation --
  # warm-start SFT on ceselder/qwen3-8b-nla-L24-finefineweb-100k explanations, then GRPO against a
  # reconstruction reward; the card claims held-out FVE ~= 75%. It is a `maemms:` entry because it
  # shares everything the layout and the objective need: it is served like a `type: full` MAEMM,
  # it takes ONE direction at ONE marker token of block 1's output under the same Karvonen
  # norm-matched add, and its rows land in maemms/<base>/<entry>/{rollouts,scores} and go through
  # the ONE clean-base scoring path (README "Methods"). What it does NOT share is the prompt, the
  # marker and the output format, so `rollouts_nla` is its only generator and every product that
  # injects with the MAEMM prompt (rollouts_hf, rollouts_vllm, parity_greedy) REFUSES type nla.
  qwen36-27b/2026-07-14_nla-av:
    type: nla
    hf: ceselder/qwen3.6-27b-nla-av
    revision: def1421d20fd949f9da13bfeeba1b600b31a654f   # asserted against the cached snapshot's dir name
    inject: {layer: 1, coef: 1.0}     # Karvonen norm-matched add at block-1 output, as the MAEMMs
    nla:
      # tokens: block of nla_meta.yaml on the checkpoint. The hook injects ONLY where
      # ids[p-1] == left_id and ids[p+1] == right_id (nla/injection.py), so the neighbours are
      # part of the contract, not a diagnostic. The marker is NOT the last prompt token.
      marker: "㈜"
      marker_id: 158983
      left_id: 29
      right_id: 510
      # nla_meta.yaml prompt_templates.actor, VERBATIM; rollouts_nla.check_sidecar asserts this is
      # equal to the shipped sidecar's text (after strip) before it generates anything.
      template: |
        You are a meticulous AI researcher conducting an important investigation into activation vectors from a language model. Your overall task is to describe the semantic content of that activation vector.

        We will pass the vector enclosed in <concept> tags into your context. You must then produce an explanation for the vector, enclosed within <explanation> tags. The explanation consists of 2-3 text snippets describing that vector.

        Here is the vector:

        <concept>{injection_char}</concept>

        Please provide an explanation.
      # The checkpoint's own generation_config.json (do_sample true), asserted against the file at
      # run time so the config cannot drift from the weights. min_new 0 is OURS: the NLA answer is
      # short and a floor would only pad it. The reference script (scripts/show_nla_generations.py)
      # hard-codes GREEDY instead; neither is marked canonical on the card and we need n texts per
      # target, so we sample.
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_new: 0}
      max_new: 64            # = rollouts.max_new; the scorer's 95-token window is the reason (README)
      card_max_new: 200      # what the reference script uses; NOT scoreable unchanged, recorded only
      n: 4                   # texts per target, default; --n overrides
      amp: exact             # default input-amplitude convention; --amp overrides (writes a variant dir)
      amp_r: median          # r for `mu`/`raw` and the `exact` fallback: layer read_layer q[0.5] of stats/resid_norm_quantiles.json, or a number
    compute: true
  qwen36-27b/2026-09-05_rlE-250:
    type: lora
    hf: ceselder/maemm-qwen36-27b-inverter-rlE-step250   # adapter at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    train_max_new: 96       # ASSUMED: mxf/config.py:72 RLConfig.max_new_tokens for the LoRA chain
    compute: false

  # --- declared only (compute: false): nothing is generated for these today ---------------------
  qwen3-8b/2026-09-03_run1-sft:
    type: lora
    src: /vol/archive/gavento-1/runs/run1/sft/final      # volume path, not an HF repo
    prompt: ours8b
    inject: {layer: 1, coef: 1.0}
    compute: false
    note: the SFT checkpoint run1's RL chain started from
  qwen36-27b/2026-09-05_init-realact23m-sft:
    type: lora
    hf: ceselder/maemm-init-realact23m-sft
    subdir: sft_final       # adapter_config.json lives here, not at the repo root
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    compute: false
  qwen36-27b/2026-09-09_pretrain-104m-full:
    type: full
    hf: ceselder/qwen36-27b-maemm-inverter-pretrain-104m
    prompt: celeste27b
    inject: {layer: 1, coef: 1.0}
    compute: false
    note: the full-parameter line's published init

heldout:
  2026-09-16_v1:
    seed: 20260916
    families:
      realact: {n: 512}
      random:  {n: 512}
      sae:     {n: 512}
      # No J-lens matrix exists on either base yet: the slot is declared so the set's shape is
      # stable, and `status: empty` means targets.py writes zero rows for it.
      jlens:   {n: 512, bases: [qwen36-27b], status: empty}
    # SPAN LENGTH of the shown realact text, in tokens. NOTE the conflict to resolve before
    # targets.py: this [1, 64] is the brief's value; Celeste's recipe (and
    # infra/2026-09-15_eval-conventions-checklist.md item 30) is L ~ U[16, 64] at p ~ U[16, T)
    # in 512-token no-BOS windows.
    realact_len: [1, 64]
    sae_min_fires: 20       # counted with the SAE's learned gate, not raw act > 0
    sae_strata: 4           # rarity quartiles of the corpus fire count

  # DRAWN, not drawn here: Ari's `features/draw_sae2m.py` wrote this set on 2026-09-20 (commit
  # b767d1a, its own README on the volume) through `features/spawn.py`, which calls the Modal
  # function directly and so BYPASSES `modal_app.main`'s "set_name in cfg['heldout']" assert --
  # which is why the set exists on the volume without ever having been declared here. Declaring it
  # now lets `--set 2026-09-20_sae2m_2k` through the entrypoint.
  #
  # `imported: true` keeps it OUT of the default-set rule: `sorted(cfg["heldout"])[-1]` would make
  # this 2,000-row sae2m set the default of every product that omits --set, silently moving
  # `2026-09-16_v1` off the tables. `common.default_heldout` takes the latest NON-imported set
  # instead, and every entrypoint uses it.
  #
  # KNOWN, not fixed here: the family label is `sae2m_enc`, not `sae`, so `autointerp`'s sae_self
  # stage and every `family == "sae"` filter in the pipeline skip these rows.
  2026-09-20_sae2m_2k:
    imported: true
    families:
      sae2m_enc: {n: 2000, bases: [qwen36-27b]}   # 2M-SAE encoder columns, UNCENTRED (no mu)

corpus:
  dataset: openbmb/Ultra-FineWeb
  files:
    - data/ultrafineweb_en/ultrafineweb-en-part-0009-of-2048.parquet
    - data/ultrafineweb_en/ultrafineweb-en-part-0010-of-2048.parquet
  tokens: 16000000          # 16M; nested subsets below are in MILLIONS of tokens
  sizes: [1, 2, 4, 8, 16]
  seed: 20260916

rollouts:
  n: 64                     # rollouts per target
  temperature: 1.0
  max_new: 64
  min_new: 16
  top_p: 1.0
  top_k: 0
  seed: 1234                # rl/rl.py GEN_SEED

modal:
  volume: maemm
  hf_home: /vol/hf
  archive: /vol/archive/gavento-1        # read-only by convention
  secrets: [hf-write]

# ---------------------------------------------------------------------------------------------
# The Delphi-style SAE autointerp evaluation (`autointerp/`, design
# infra/2026-09-16_autointerp-design.md). APPENDED 2026-09-16; nothing above this line changed.
# Models are ANTHROPIC ids (Tomas 2026-09-16: the direct Messages API, not OpenRouter, so no
# `anthropic/` prefix). NOTE `temperature` below is recorded for the protocol but NOT SENT: the
# parameter does not exist on the Anthropic Messages API for this model generation.
autointerp:
  explainer_model: claude-sonnet-5
  scorer_model: claude-sonnet-5
  # RECORDED, NOT SENT. `anthropic` 1.6.0's messages.create() has no `temperature` parameter for
  # this model generation (MEASURED 2026-09-16: TypeError), so the design's "temperature 0" is not
  # achievable on this API. Kept here as the protocol's stated intent; run.py asserts it is absent
  # from every request body and says so in costs.json.
  temperature: 0.0
  # 600, not the lifted 300: MEASURED 2026-09-16 on the Anthropic API, 3 of 18 explainer
  # answers hit a 300-token cap and had to be retried under A10. Output tokens are billed
  # by use, so a higher cap costs nothing unless it is used, while a retry pays the whole
  # 2.4k-token input again.
  explainer_max_tokens: 600
  scorer_max_tokens: 600        # MEASURED 2026-09-15: 64 and 300 truncate the narrating judge
  n_examples: 16                # N in the substitution arms; ARM_SPECS pins every per-arm count
  scorer_batch: 5               # Delphi's num_examples_per_scorer_prompt
  n_pos: 20                     # test positives, 5 from each of the four stored activation bands
  n_neg: 20                     # test negatives, zero-activation windows of the shared _random256
  corpus_prefix_m: 4            # the "cheap corpus" nested size, in MILLIONS of tokens
  pilot_features: 64            # 16 per density quartile
  feat_seed: 1234
  shuffle_seed: 20260916        # test-item order and the C4M mix; per feature, so arms stay paired
  concurrency: 32
  timeout_s: 90.0
  max_cost_usd: 400.0           # hard ceiling on one `run` call's API spend (total budget ~$500)
  probe_features: 8             # UNUSED since 2026-09-16: every stage is now projected with
                                # messages.count_tokens BEFORE it is submitted, which lands before
                                # any money is spent rather than after eight features.
  # --- AMENDMENTS 2026-09-16 (coordinator, after two design reviews) --------------------------
  # The shared negative pool: scan's `_random256` carries 256 windows and only a per-feature
  # MAXIMUM, and 14 of the densest tested features cannot supply 20 zero-activation negatives from
  # it. `random_pool` re-draws 2048 windows and stores per-token activations, which also makes
  # near-miss negatives (0 < max <= gate) available at no extra cost.
  random_pool_windows: 2048
  random_pool_seed: 20260916
  # Negative mix, summing to n_neg (amendment A5): 10 zero-activation windows (Delphi's published
  # `non_activating_source "random"`, which stays the reference) + 10 near-miss windows with
  # 0 < peak <= gate, which is what keeps the negative side off its ceiling. Every test row carries
  # `src`, so the two halves are also reported apart.
  n_neg_nearmiss: 10
  # Where a near-miss negative comes from: `qband` = the stored q0..q3 rows that fall BELOW the
  # gate (which gate-consistent positives release), `random` = the random pool's 0 < max <= gate
  # windows.
  nearmiss_source: qband
  # Test positives are GATE-CONSISTENT: only a window whose stored peak pre-gate activation
  # exceeds the SAE gate counts as a positive, and the band draw runs over gate-passing rows only.
  gate_consistent_positives: true
  # When the q-bands cannot supply n_pos gate-passing windows, fall back to the top-ranked windows
  # BEYOND the ones any arm shows. Counted and flagged per feature, never silent.
  allow_top_fallback: true
  # The scorer-only floor arm: each feature's test set scored with another feature's description,
  # under the same scorer prompts. No explainer call of its own.
  floor_arm: R-shuffled
  floor_source_arm: C16
  # The JUDGE-ONLY floor (coordinator, 2026-09-16): draw 1 of C16 scored a SECOND time with the
  # SAME description, scorer calls only. `C16-draw2` mixes judge variation with test-set-draw
  # variation; this one isolates the judge half, which matters more now that the API has no
  # temperature parameter and nothing is deterministic.
  judge_floor_arm: C16-judge2
  # --- Anthropic Messages API (Tomas 2026-09-16, replacing OpenRouter) ------------------------
  # `sync` = messages.create through a bounded thread pool; `batch` = one Message Batch per stage
  # at HALF price, latency measured on the pilot before the full run commits to it.
  path: sync
  # Refuse to run a stage projecting more than this without --approved. The projection comes from
  # messages.count_tokens on a sample of the uncached jobs, so it lands before any money is spent.
  stop_above_usd: 100.0
